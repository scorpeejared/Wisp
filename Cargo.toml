[workspace]
resolver = "2"
members = [
    "crates/wisp-core",
    "crates/wisp-invite",
    "crates/wisp-usb",
    "crates/wisp-session",
    "crates/wisp-server",
    "crates/wisp-admin",
    "crates/wisp-messaging",
    "crates/wisp-biometric",
    "crates/wisp-machine",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }

# Argon2 and the AEAD are unusably slow when compiled without optimisation,
# which makes an unoptimised `cargo test` run take minutes. Optimise the
# crypto crates even in dev/test builds; everything else stays debuggable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
